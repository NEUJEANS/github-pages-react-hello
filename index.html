<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAVENLY React Conversion</title>
    <script type="module">
      const existing = globalThis.__HAVENLY_AUTH_CONFIG__

      await new Promise((resolve) => {
        const runtimeConfigScript = document.createElement('script')
        runtimeConfigScript.src = new URL('./havenly-auth-config.js', globalThis.location?.href ?? document.baseURI).toString()
        runtimeConfigScript.async = false
        runtimeConfigScript.onload = () => resolve()
        runtimeConfigScript.onerror = () => resolve()
        document.head.append(runtimeConfigScript)
      })

      const fileConfig = globalThis.__HAVENLY_AUTH_CONFIG__
      const storedRaw = globalThis.localStorage?.getItem('havenly.auth.runtimeConfig')
      let stored = null

      if (storedRaw) {
        try {
          stored = JSON.parse(storedRaw)
        } catch {
          stored = null
        }
      }

      const params = new URLSearchParams(globalThis.location?.search ?? '')
      const queryApiBaseUrl = params.get('authApiBaseUrl')?.trim() ?? ''
      const queryCredentialsMode = params.get('authCredentials')?.trim() ?? ''
      const queryLoopbackProbe = params.get('authLoopbackProbe') === '1'

      globalThis.__HAVENLY_AUTH_CONFIG__ = {
        ...(fileConfig && typeof fileConfig === 'object' ? fileConfig : {}),
        ...(stored && typeof stored === 'object' ? stored : {}),
        ...(existing && typeof existing === 'object' ? existing : {}),
        ...(queryApiBaseUrl ? { apiBaseUrl: queryApiBaseUrl.replace(/\/$/, '') } : {}),
        ...(queryCredentialsMode ? { credentialsMode: queryCredentialsMode } : {}),
        ...(queryLoopbackProbe ? { allowLoopbackProbe: true } : {}),
      }

      await import('/src/main.jsx')
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
