name: Secret scan

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        env:
          TRUFFLEHOG_VERSION: 3.94.3
        run: |
          curl -sSL -o trufflehog.tar.gz "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          tar -xzf trufflehog.tar.gz
          chmod +x trufflehog

      - name: Run secret scan
        run: ./trufflehog git "file://${GITHUB_WORKSPACE}" --results=verified,unknown --fail
